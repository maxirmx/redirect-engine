name: build-and-test

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.adoc'
      - '**.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

jobs:
  build:
    name: Build redirect engine
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/maxirmx/gentoo-pre-redirect-container:latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: true

    - name: Configure
      run: cmake -B build

    - name: Build
      run: cmake --build build  --parallel 4
